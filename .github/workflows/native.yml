name: Native contracts and functional tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux
          - runner: macos-15
            target: aarch64-macos
          - runner: macos-15-intel
            target: x86_64-macos
    steps:
      - name: Check out this job's source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Select native Python for the schema fixture
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Run Debug and ReleaseSafe with verified Zig 0.16.0
        shell: bash
        env:
          # Each matrix job has its own hosted runner. Keep the fixture prefix
          # short enough for Darwin's 104-byte sockaddr_un path, in both modes.
          CI_STATE: ${{ runner.temp }}/z-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/source/tools/ci/native.py"
          --source "$GITHUB_WORKSPACE/source"
          --state "$CI_STATE"
          --target "${{ matrix.target }}"
          --runner "${{ matrix.runner }}"
      - name: Preserve command results, provenance, binaries, and transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/z-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          if-no-files-found: error
          # This directory contains only produced evidence and synthetic fixtures.
          include-hidden-files: true
          retention-days: 14
          compression-level: 6
